name: Research package checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install 'build>=1.2,<2' ruff==0.14.2
      - name: Lint Python correctness
        run: python -m ruff check .
      - name: Build wheel and source archive
        run: python -m build
      - name: Install wheel with test dependencies
        run: python -m pip install dist/*.whl pytest
      - name: Test installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests"
          python -m figure2_experiments.run_experiment1 --help
          python -m figure2_experiments.run_all --help
