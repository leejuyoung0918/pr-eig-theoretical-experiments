[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "figure2-experiments"
version = "1.0.0"
description = "Independent simulations for information collapse, sequential convergence, and noiseless multiway localization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2,<2", "ruff==0.14.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"figure2_experiments" = "."}
packages = [
  "figure2_experiments",
  "figure2_experiments.exp_a_information",
  "figure2_experiments.exp_b_sequential",
  "figure2_experiments.exp_b_long",
  "figure2_experiments.exp_c_noiseless",
  "figure2_experiments.plotting",
  "figure2_experiments.experiment1",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
